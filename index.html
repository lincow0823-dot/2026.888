<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>終極密碼</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game-panel">
      <h1>終極密碼</h1>

      <div class="range-box">
        <span>範圍</span>
        <strong id="range">1 ～ 100</strong>
      </div>

      <label class="sr-only" for="guess">請輸入猜測數字</label>
      <input id="guess" type="number" min="1" max="100" step="1" placeholder="請輸入 1～100" />

      <div class="actions">
        <button id="guess-button" type="button">送出</button>
        <button id="reset-button" type="button" class="secondary">重新開始</button>
      </div>

      <p id="message" class="message">請輸入一個數字開始遊戲</p>
      <p id="attempts">已猜 0 次</p>
    </main>
  </body>
</html>
